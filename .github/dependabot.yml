version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
      semver-major-days: 30
    # Capacitor's packages peer-depend on matching versions, so a lone
    # bump fails npm ci. One group keeps them moving together.
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
